name: Profil

on:
  schedule:
    - cron: "17 4 * * *" # tous les jours vers 5 h (heure de Paris)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profil.json, assets/portrait.txt, scripts/terminal.py, scripts/animations.py]

permissions:
  contents: write

concurrency:
  group: profil
  cancel-in-progress: true

jobs:
  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stats GitHub et animations → assets/
        run: |
          python scripts/terminal.py
          python scripts/animations.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || (git commit -m "Mise à jour des stats" && git push)

